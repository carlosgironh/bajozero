<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0066B2" />
      <stop offset="100%" stop-color="#00A8E8" />
    </linearGradient>
    <linearGradient id="snowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#E0F2FE" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle Base with Bajo Zero Gradient -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad)" stroke="#38BDF8" stroke-width="1.5" />

  <!-- Inner Frost Ring Accent -->
  <circle cx="32" cy="32" r="23" fill="none" stroke="#FFFFFF" stroke-opacity="0.15" stroke-dasharray="3 3" />

  <!-- Snowflake Crystal Group -->
  <g fill="url(#snowGrad)" stroke="url(#snowGrad)" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)">
    
    <!-- Central Hexagon / Diamond Core -->
    <polygon points="32,26 37,29 37,35 32,38 27,35 27,29" fill="#FFFFFF" />
    <circle cx="32" cy="32" r="2.5" fill="#0066B2" />

    <!-- Vertical Arm -->
    <line x1="32" y1="12" x2="32" y2="52" stroke-width="3" />
    <!-- Vertical Chevrons Top -->
    <path d="M26,19 L32,14 L38,19" fill="none" stroke-width="2.5" />
    <path d="M28,24 L32,20 L36,24" fill="none" stroke-width="2" />
    <!-- Vertical Chevrons Bottom -->
    <path d="M26,45 L32,50 L38,45" fill="none" stroke-width="2.5" />
    <path d="M28,40 L32,44 L36,40" fill="none" stroke-width="2" />

    <!-- Diagonal Arm 60deg (Top-Right to Bottom-Left) -->
    <line x1="14.7" y1="22" x2="49.3" y2="42" stroke-width="3" />
    <!-- Chevrons Top-Right -->
    <path d="M42.5,33 L49.3,42 L39.5,41" fill="none" stroke-width="2.5" />
    <path d="M38,32 L44,39 L35.5,38.5" fill="none" stroke-width="2" />
    <!-- Chevrons Bottom-Left -->
    <path d="M21.5,31 L14.7,22 L24.5,23" fill="none" stroke-width="2.5" />
    <path d="M26,32 L20,25 L28.5,25.5" fill="none" stroke-width="2" />

    <!-- Diagonal Arm 120deg (Top-Left to Bottom-Right) -->
    <line x1="14.7" y1="42" x2="49.3" y2="22" stroke-width="3" />
    <!-- Chevrons Top-Left -->
    <path d="M39.5,23 L49.3,22 L42.5,31" fill="none" stroke-width="2.5" />
    <path d="M35.5,25.5 L44,25 L38,32" fill="none" stroke-width="2" />
    <!-- Chevrons Bottom-Right -->
    <path d="M24.5,41 L14.7,42 L21.5,33" fill="none" stroke-width="2.5" />
    <path d="M28.5,38.5 L20,39 L26,32" fill="none" stroke-width="2" />

    <!-- End Dots -->
    <circle cx="32" cy="11" r="1.5" fill="#FFFFFF" />
    <circle cx="32" cy="53" r="1.5" fill="#FFFFFF" />
    <circle cx="13.8" cy="21.5" r="1.5" fill="#FFFFFF" />
    <circle cx="50.2" cy="42.5" r="1.5" fill="#FFFFFF" />
    <circle cx="13.8" cy="42.5" r="1.5" fill="#FFFFFF" />
    <circle cx="50.2" cy="21.5" r="1.5" fill="#FFFFFF" />
  </g>
</svg>
