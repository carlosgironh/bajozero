<!DOCTYPE html>
<html lang="es">
<head>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso | Bajo Zero Panamá</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/config.js"></script>
    <link rel="stylesheet" href="css/style.css?v=3">
</head>
<body class="min-h-screen bg-gradient-to-br from-blue-900 to-blue-600 flex items-center justify-center p-4 relative overflow-hidden">
    <!-- Efectos de fondo -->
    <div class="absolute inset-0 z-0 opacity-20 pointer-events-none" style="background-image: url('data:image/svg+xml,%3Csvg width=\'60\' height=\'60\' viewBox=\'0 0 60 60\' xmlns=\'http://www.w3.org/2000/svg\'%3E%3Cg fill=\'none\' fill-rule=\'evenodd\'%3E%3Cg fill=\'%23ffffff\' fill-opacity=\'1\'%3E%3Cpath d=\'M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z\'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E');"></div>
    <div id="particles" class="absolute inset-0 z-0 pointer-events-none overflow-hidden"></div>

    <div class="glass-card w-full max-w-md p-8 relative z-10 animate-fade-in">
        <div class="text-center mb-8">
            <div class="inline-flex items-center justify-center w-16 h-16 rounded-full bg-brand-primary/20 text-brand-primary text-3xl mb-4 shadow-inner">
                <i class="fas fa-snowflake"></i>
            </div>
            <h1 class="text-2xl font-bold text-gray-800">Bajo Zero Panamá</h1>
            <p class="text-gray-500 mt-2 font-medium">Sistema de Gestión Profesional</p>
        </div>

        <div class="hidden bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded relative mb-4" id="errorMessage"></div>

        <form id="loginForm" class="space-y-6">
            <div>
                <label for="email" class="block text-sm font-semibold text-gray-700 mb-2">Correo Electrónico</label>
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                        <i class="fas fa-envelope text-gray-400"></i>
                    </div>
                    <input 
                        type="email" 
                        id="email" 
                        name="email" 
                        class="input-field pl-10"
                        placeholder="tu@email.com" 
                        required 
                        autocomplete="email"
                    >
                </div>
            </div>

            <div>
                <label for="password" class="block text-sm font-semibold text-gray-700 mb-2">Contraseña</label>
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                        <i class="fas fa-lock text-gray-400"></i>
                    </div>
                    <input 
                        type="password" 
                        id="password" 
                        name="password" 
                        class="input-field pl-10 pr-10"
                        placeholder="••••••••" 
                        required
                        autocomplete="current-password"
                    >
                    <button type="button" class="absolute inset-y-0 right-0 pr-3 flex items-center text-gray-400 hover:text-brand-primary" id="togglePassword">
                        <i class="fas fa-eye"></i>
                    </button>
                </div>
            </div>

            <button type="submit" class="btn-primary w-full text-lg mt-4" id="btnLogin">
                Iniciar Sesión
            </button>
        </form>

        <div class="mt-6 pt-6 border-t border-gray-100/50">
            <div class="flex items-center justify-center gap-2 text-sm text-gray-500" id="roleBadge">
                <i class="fas fa-shield-alt text-brand-primary" id="roleIcon"></i>
                <span id="roleText" class="font-medium">Esperando credenciales...</span>
            </div>
        </div>

        <div class="mt-8 text-center">
            <a href="index.html" class="text-sm font-medium text-gray-500 hover:text-brand-primary transition-colors">
                <i class="fas fa-arrow-left mr-1"></i> Volver al sitio principal
            </a>
        </div>
    </div>

    <script>
        // La configuración y el supabaseClient se inicializan en js/config.js

        // Generar partículas de fondo
        function createParticles() {
            const container = document.getElementById('particles');
            const particleCount = 20;
            
            for (let i = 0; i < particleCount; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                particle.style.left = Math.random() * 100 + '%';
                particle.style.width = Math.random() * 10 + 5 + 'px';
                particle.style.height = particle.style.width;
                particle.style.animationDelay = Math.random() * 15 + 's';
                particle.style.animationDuration = (Math.random() * 10 + 10) + 's';
                container.appendChild(particle);
            }
        }

        createParticles();

        // Toggle password visibility
        document.getElementById('togglePassword').addEventListener('click', function() {
            const passwordInput = document.getElementById('password');
            passwordInput.type = passwordInput.type === 'password' ? 'text' : 'password';
            this.textContent = passwordInput.type === 'password' ? '👁️' : '🙈';
        });

        // Manejar login
        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const btn = document.getElementById('btnLogin');
            const errorDiv = document.getElementById('errorMessage');
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;

            // Reset error
            errorDiv.classList.remove('show');
            btn.classList.add('loading');
            btn.disabled = true;

            try {
                // 1. Login con Supabase Auth
                const { data: authData, error: authError } = await supabaseClient.auth.signInWithPassword({
                    email: email,
                    password: password
                });

                if (authError) throw authError;

                // 2. Obtener perfil y rol
                const { data: profile, error: profileError } = await supabaseClient
                    .from('profiles')
                    .select('role, full_name, is_active')
                    .eq('id', authData.user.id)
                    .single();

                if (profileError) throw profileError;

                if (profile.is_active !== true) {
                    throw new Error('Cuenta suspendida. Contacte al administrador.');
                }

                // 3. Mostrar indicador de rol
                const roleBadge = document.getElementById('roleBadge');
                const roleIcon = document.getElementById('roleIcon');
                const roleText = document.getElementById('roleText');

                const roleConfig = {
                    'superadmin': { icon: '👑', text: 'Super Administrador', color: '#f59e0b' },
                    'coordinador': { icon: '👩‍💼', text: 'Coordinador(a)', color: '#8b5cf6' },
                    'supervisor': { icon: '👁️', text: 'Supervisor', color: '#10b981' },
                    'tecnico': { icon: '🔧', text: 'Técnico', color: '#3b82f6' }
                };

                const config = roleConfig[profile.role] || { icon: '👤', text: 'Usuario', color: '#64748b' };
                roleIcon.textContent = config.icon;
                roleText.textContent = `Accediendo como ${config.text}...`;
                roleBadge.style.background = `linear-gradient(135deg, ${config.color} 0%, ${adjustColor(config.color, -20)} 100%)`;
                roleBadge.classList.add('show');

                // 4. Redirigir según rol después de breve delay
                setTimeout(() => {
                    const routes = {
                        'superadmin': 'admin.html',
                        'coordinador': 'admin.html',
                        'supervisor': 'panel.html',
                        'tecnico': 'panel.html'
                    };
                    window.location.href = routes[profile.role] || 'inicio.html';
                }, 1500);

            } catch (error) {
                console.error('Error:', error);
                errorDiv.textContent = error.message === 'Invalid login credentials' 
                    ? 'Correo o contraseña incorrectos' 
                    : error.message;
                errorDiv.classList.add('show');
                btn.classList.remove('loading');
                btn.disabled = false;
            }
        });

        // Helper para ajustar color
        function adjustColor(color, amount) {
            return color; // Simplificado para demo
        }

        // Verificar si ya hay sesión activa
        async function checkSession() {
            const { data: { session } } = await supabaseClient.auth.getSession();
            if (session) {
                const { data: profile } = await supabaseClient
                    .from('profiles')
                    .select('role')
                    .eq('id', session.user.id)
                    .single();
                
                if (profile) {
                    const routes = {
                        'superadmin': 'admin.html',
                        'coordinador': 'admin.html',
                        'supervisor': 'panel.html',
                        'tecnico': 'panel.html'
                    };
                    window.location.href = routes[profile.role] || 'inicio.html';
                }
            }
        }

        checkSession();
    </script>
</body>
</html>
