<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A3 Solution ERP - Acceso</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
* { box-sizing: border-box; }
body { 
  font-family: 'Inter', sans-serif; 
  background: linear-gradient(135deg, #0f172a 0%, #1e3a8a 50%, #0f172a 100%);
  min-height: 100vh;
  margin: 0;
  color: #f1f5f9;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 1rem;
}
.glass-panel {
  background: rgba(30, 41, 59, 0.95);
  backdrop-filter: blur(20px);
  border: 1px solid rgba(255, 255, 255, 0.1);
  box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
  border-radius: 1rem;
  padding: 2rem;
  width: 100%;
  max-width: 400px;
}
input {
  background: #1e293b;
  border: 2px solid #475569;
  color: #ffffff;
  border-radius: 0.75rem;
  padding: 0.75rem 1rem;
  width: 100%;
  font-size: 16px;
  margin-top: 0.5rem;
  transition: all 0.2s;
}
input:focus {
  outline: none;
  border-color: #3b82f6;
  background: #0f172a;
}
input::placeholder { color: #64748b; }
.btn-primary { 
  background: linear-gradient(135deg, #2563eb, #3b82f6); 
  color: white; 
  padding: 0.75rem; 
  border-radius: 0.75rem; 
  font-weight: 600; 
  border: none; 
  cursor: pointer; 
  width: 100%;
  margin-top: 1.5rem;
  font-size: 1rem;
}
.btn-primary:hover { transform: translateY(-1px); }
.error-box {
  background: rgba(239, 68, 68, 0.1);
  border: 1px solid rgba(239, 68, 68, 0.3);
  color: #f87171;
  padding: 0.75rem;
  border-radius: 0.5rem;
  margin-top: 1rem;
  font-size: 0.875rem;
  display: none;
}
.success-box {
  background: rgba(34, 197, 94, 0.1);
  border: 1px solid rgba(34, 197, 94, 0.3);
  color: #4ade80;
  padding: 0.75rem;
  border-radius: 0.5rem;
  margin-bottom: 1rem;
  font-size: 0.875rem;
  display: none;
}
</style>
</head>
<body>

<div class="glass-panel">
  <div style="text-align: center; margin-bottom: 2rem;">
    <div style="width: 80px; height: 80px; background: linear-gradient(135deg, #3b82f6, #8b5cf6); border-radius: 1rem; margin: 0 auto 1rem; display: flex; align-items: center; justify-content: center; font-size: 2rem; font-weight: bold;">
      A3
    </div>
    <h1 style="font-size: 1.5rem; font-weight: 700; margin-bottom: 0.5rem;">A3 Solution ERP</h1>
    <p style="color: #94a3b8; font-size: 0.875rem;">Sistema de Gestión Empresarial</p>
  </div>

  <!-- Mensaje de logout exitoso -->
  <div id="logoutMsg" class="success-box">
    <i class="fas fa-check-circle mr-2"></i> Sesión cerrada correctamente
  </div>

  <!-- Formulario de Login -->
  <form id="loginForm" onsubmit="handleLogin(event)">
    <div style="margin-bottom: 1rem;">
      <label style="display: block; font-size: 0.875rem; color: #cbd5e1; margin-bottom: 0.25rem;">Correo Electrónico</label>
      <input type="email" id="loginEmail" required placeholder="admin@a3solution.com" autocomplete="email">
    </div>
    
    <div style="margin-bottom: 1rem;">
      <label style="display: block; font-size: 0.875rem; color: #cbd5e1; margin-bottom: 0.25rem;">Contraseña</label>
      <input type="password" id="loginPassword" required placeholder="••••••••" autocomplete="current-password">
    </div>

    <div id="errorBox" class="error-box"></div>

    <button type="submit" class="btn-primary" id="loginBtn">
      <i class="fas fa-sign-in-alt mr-2"></i> Ingresar al Sistema
    </button>
  </form>

  <!-- Loading State -->
  <div id="loadingState" style="display: none; text-align: center; padding: 2rem;">
    <div style="width: 40px; height: 40px; border: 3px solid #1e293b; border-top-color: #3b82f6; border-radius: 50%; animation: spin 1s linear infinite; margin: 0 auto 1rem;"></div>
    <p style="color: #64748b; font-size: 0.875rem;">Verificando credenciales...</p>
  </div>
</div>

<style>
@keyframes spin { to { transform: rotate(360deg); } }
</style>

<script>
const CONFIG = {
  SUPABASE_URL: 'https://fzlrjfebfodeptkynuuy.supabase.co',
  SUPABASE_ANON_KEY: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZ6bHJqZmViZm9kZXB0a3ludXV5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQ0NTYwODMsImV4cCI6MjA5MDAzMjA4M30.cPStv8NMccBSLKEJ8LqkwoZ3wLB8volzE0jMVL6No_I'
};

const supabaseClient = window.supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_ANON_KEY, {
  auth: { autoRefreshToken: true, persistSession: true, detectSessionInUrl: false }
});

// Verificar si viene de logout
const urlParams = new URLSearchParams(window.location.search);
if (urlParams.get('logout') === '1') {
  document.getElementById('logoutMsg').style.display = 'block';
  // Limpiar cualquier sesión residual
  sessionStorage.removeItem('a3_session');
  supabaseClient.auth.signOut();
}

// IMPORTANTE: No redirigir automáticamente aquí para evitar el bucle
// Solo verificamos si hay sesión guardada en sessionStorage (no en Supabase directamente)
window.addEventListener('DOMContentLoaded', async () => {
  const session = JSON.parse(sessionStorage.getItem('a3_session') || '{}');
  
  // Solo redirigir si hay sesión reciente (menos de 1 hora) y no viene de logout
  if (session.user_id && session.timestamp && (Date.now() - session.timestamp < 3600000) && urlParams.get('logout') !== '1') {
    // Redirigir según rol guardado
    if (session.role === 'admin') {
      window.location.replace('./control.html');
    } else {
      window.location.replace('./erp.html');
    }
  }
  // Si no hay sesión o expiró, mostrar login (no hacer nada, el formulario ya está visible)
});

async function handleLogin(e) {
  e.preventDefault();
  
  const email = document.getElementById('loginEmail').value.trim();
  const password = document.getElementById('loginPassword').value;
  const errorBox = document.getElementById('errorBox');
  const loadingState = document.getElementById('loadingState');
  const loginForm = document.getElementById('loginForm');
  
  // Reset
  errorBox.style.display = 'none';
  errorBox.textContent = '';
  loginForm.style.display = 'none';
  loadingState.style.display = 'block';
  
  try {
    const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
    
    if (error) throw error;
    
    // Obtener perfil
    const { data: profile, error: profileError } = await supabaseClient
      .from('profiles')
      .select('role, username, company_name')
      .eq('id', data.user.id)
      .single();
    
    if (profileError) throw profileError;
    
    // Guardar sesión
    sessionStorage.setItem('a3_session', JSON.stringify({
      user_id: data.user.id,
      role: profile.role,
      email: data.user.email,
      username: profile.username,
      company: profile.company_name,
      timestamp: Date.now()
    }));
    
    // Redirigir según rol
    if (profile.role === 'admin') {
      window.location.replace('./control.html');
    } else {
      window.location.replace('./erp.html');
    }
    
  } catch (error) {
    console.error('Login error:', error);
    errorBox.textContent = error.message === 'Invalid login credentials' 
      ? 'Credenciales incorrectas. Verifique email y contraseña.' 
      : 'Error: ' + error.message;
    errorBox.style.display = 'block';
    loginForm.style.display = 'block';
    loadingState.style.display = 'none';
  }
}
</script>

</body>
</html>
